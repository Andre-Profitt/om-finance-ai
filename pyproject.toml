[project]
name = "oai-finance"
version = "0.1.0"
description = "O&M Finance Revenue Integrity Control Tower — governed AI for oncology-practice revenue leakage prioritization"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Andre Profitt" }]
requires-python = ">=3.11"
dependencies = [
    "polars>=1.20.0",
    "pyarrow>=18.0.0",
    "numpy>=2.0.0",
    "scikit-learn>=1.5.0",
    "lightgbm>=4.5.0",
    "mlflow>=2.18.0",
    "matplotlib>=3.9.0",
    "pydantic>=2.9.0",
    "click>=8.1.0",
    "requests>=2.32.0",
    "openpyxl>=3.1.0",
    "rich>=13.9.0",
]

[project.optional-dependencies]
rag = [
    "sentence-transformers>=3.3.0",
    "faiss-cpu>=1.9.0",
]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.8.0",
]

[project.scripts]
oai-finance = "oaifinance.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oaifinance"]

[tool.ruff]
line-length = 100
target-version = "py311"
