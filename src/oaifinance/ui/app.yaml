# Databricks App configuration for the O&M Finance AI Control Tower
# reviewer surface. Deployed via the parent databricks.yml bundle.

command:
  [
    "streamlit",
    "run",
    "app.py",
    "--server.port=8000",
    "--server.address=0.0.0.0",
  ]
env:
  - name: STREAMLIT_BROWSER_GATHER_USAGE_STATS
    value: "false"
  - name: OAI_ENABLE_LLM_PARAPHRASE
    valueFrom: "OAI_ENABLE_LLM_PARAPHRASE"
